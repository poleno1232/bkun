
services:
#  сервис основного api приложения
  app:
#    папка для сборки и используемый dockerfile
    build:
      context: ../
      dockerfile: ./docker/php-fpm/Dockerfile
#     монтирование файлов проекта в контейнер
    volumes:
      - ../App:/application
      - ./php-fpm/php-ini-overrides.ini:/usr/local/etc/php/conf.d/php-ini-overrides.ini
      - ./php-etc/:/usr/local/etc/
    logging:
      options:
        max-size: "50m"

  goapp:
    build:
      context: ../
      dockerfile: ./docker/go/Dockerfile
      args:
        - GO_APP_NAME=${GO_MODULE}
        - GO_VERSION=${GO_VERSION}
    image: go_app
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ../Go:/usr/src/app
      - ../Go/logs:/usr/src/app/logs

  #   Nginx Service
  webserver:
    image: nginx:1.17.9-alpine
    working_dir: /application
    volumes:
      - ../App:/application
#    монтируется конфиг nginx для приложения
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - app
      - goapp
    logging:
      options:
        max-size: "50m"

  # PostgreSQL Service
  db:
    image: 'bitnamilegacy/postgresql:13.2.0'
    ports:
      - '${POSTGRESQL_PORT}:5432'
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=${POSTGRESQL_POSTGRES_PASSWORD}
      - POSTGRESQL_USERNAME=${POSTGRESQL_USERNAME}
      - POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRESQL_DATABASE}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRESQL_USERNAME} -d ${POSTGRESQL_DATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "50m"

  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # --- KRaft Settings (No Zookeeper needed) ---
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # --- Listener Settings ---
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://kafka:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # --- Topic Settings ---
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    healthcheck:
      test: [ "CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./kafka_data:/kafka

  kafka-init:
    image: bitnamilegacy/kafka:3.7
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy # Waits until Kafka is fully ready
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo '--- Initializing Kafka Topics ---'
      
      # Create Topic 1
      kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --replication-factor 1 --partitions 1 --topic chat-messages
      
      echo '--- Successfully created the following topics: ---'
      kafka-topics.sh --list --bootstrap-server kafka:9092
      "

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: 'local-cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:9092'

  # Redis Service
  redis:
    image: "redis:6.2-alpine"
    sysctls:
      net.core.somaxconn: 1024
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    logging:
      options:
        max-size: "50m"

  scheduler:
    build:
      context: ../
      dockerfile: ./docker/php-fpm/Dockerfile
    working_dir: /application
    volumes:
      - ../App:/application
    command: "php artisan schedule:work"
    logging:
      options:
        max-size: "50m"

# Volumes
volumes:
  dbdata:
    driver: local
  kafka_data:
    driver: local